# Command tab completion for players who aren't OP (OPs always get every command).
# A command is suggested when the player can use it:
#  - it declares a permission in its plugin.yml and the player has it,
#  - it is an Essentials command and the player has essentials.<command>,
#  - it is a mattstudios command (/staff, /freeze, /customblocks, ...) and the player has its @Permission, or it has none,
#  - it is listed below under "public", or under "permissions" with a permission the player has.
# Everything else, and every plugin:command name, is not suggested. Typed commands are not affected: each command still
# checks its own permission. Commands go by their main name; aliases follow it. The file is read when the server
# starts.

